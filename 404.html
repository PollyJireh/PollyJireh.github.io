<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Polly Jireh Mane</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0a0c12;color:#eef1f8;font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:1.5rem}
  h1{font-size:clamp(4rem,14vw,7rem);margin:0;line-height:1;background:linear-gradient(135deg,#7fa4ff,#a48dff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#a3adc2}
  a{display:inline-block;margin-top:.8rem;padding:.7rem 1.25rem;border-radius:11px;background:linear-gradient(135deg,#4a7bf5,#7b5bf0);color:#fff;text-decoration:none;font-weight:600}
  a:focus-visible{outline:2px solid #35d6e8;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist, or it has moved. A suspicious link? Good instinct.</p>
    <a id="home" href="./">Back to the portfolio</a>
  </main>
  <script>
    // Works on GitHub Pages project sites (/repo-name/) as well as a custom domain.
    var seg = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/';
    document.getElementById('home').href = base;
  </script>
</body>
</html>
